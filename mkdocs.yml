docs_dir: docs
nav:
- Home: index.md
- API reference:
  - Authentication: api/authentication.md
  - Default: api/default.md
  - Mock: api/mock.md
  - Mock customers: api/mock-customers.md
  - Mock docs: api/mock-docs.md
  - Mock openapi JSON: api/mock-openapi-json.md
  - Mock orders: api/mock-orders.md
  - Mock products: api/mock-products.md
  - Mock reviews: api/mock-reviews.md
  - Mock schemas JSON: api/mock-schemas-json.md
  - Mock tickets: api/mock-tickets.md
  - Preman probe: api/preman-probe.md
  - Projects: api/projects.md
  - Ready: api/ready.md
  - System: api/system.md
  - Tasks: api/tasks.md
  - Test UI: api/test-ui.md
- SDKs:
  - Python: sdk/python.md
- Changelog: changelog.md
