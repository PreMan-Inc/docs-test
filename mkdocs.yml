# Placeholder. PreMan rewrites this file on every release, deriving the nav from
# the OpenAPI tags in the published contract. It is committed here only so the
# first Pages build is green before PreMan has ever written to the repository.
site_name: Greptile Codex API
site_description: API reference and client SDKs, generated from the live contract by PreMan.
site_url: https://preman-inc.github.io/docs-test/
repo_url: https://github.com/PreMan-Inc/docs-test
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Changelog: changelog.md
